<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestioná los pedidos recibidos de tus clientes en OficiosYa.">
  <title>OficiosYa — Pedidos recibidos</title>
  <link rel="icon"  href="./img/OfiGO.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

  <header class="topbar">
    <div class="marca d-flex align-items-center gap-2">

    <nav>
      <a href="login.html" id="btn-cerrar-sesion">Cerrar sesión</a>

    <section class="encabezado-pagina mt-3">

  <nav class="bottom-nav">

    <a href="perfil.html">
      <span class="icono-nav"><img src="img/user.png" class="icono-home"></span>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="OfiGO: encontrá y filtrá profesionales de distintos oficios y servicios en Tucumán.">

    <title>OfiGO — Explorar</title>

    <link rel="icon" href="./img/OfiGO.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-explorar">

    <header class="topbar">
        <a href="index.html" class="marca d-flex align-items-center gap-2 text-white text-decoration-none" title="Ir a la página principal">
            <img src="./img/hombrelogo.png"
                class="hombre-logo"
                alt="OfiGO"
                style="height: 80px; width: auto;">

            <span>
                Ofi<span class="text-warning">GO</span>
            </span>
        </a>

        <nav id="topbar-usuario">
            <a href="index.html" class="text-decoration-none">Página principal</a>
            <a href="#" id="btn-cerrar-sesion" class="text-warning fw-bold text-decoration-none">
                Cerrar sesión
            </a>
        </nav>
    </header>


    <main class="container py-3" style="max-width: 1200px;">

        <section class="row g-4 explorar-layout">

            <aside class="col-12 col-md-4 col-lg-3">

                <section class="panel-filtros">

                    <label for="input-busqueda" class="form-label small fw-bold">
                        Buscar
                    </label>

                    <input
                        type="search"
                        id="input-busqueda"
                        class="form-control rounded-pill mb-3"
                        placeholder="Oficio, nombre o especialidad">

                    <h2 class="h6 fw-bold mb-3">
                        Categorías
                    </h2>

                    <nav class="lista-categorias" id="grid-categorias" aria-label="Categorías">

                        <button type="button" class="chip-categoria activo" data-categoria="todos">
                            <img src="img/people.png" class="boton-img" alt="">
                            <span>Todas</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Electricidad">
                            <img src="img/innovation.png" class="boton-img" alt="">
                            <span>Electricidad</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Plomería">
                            <img src="img/plumbing.png" class="boton-img" alt="">
                            <span>Plomería</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Pintura">
                            <img src="img/house-painting.png" class="boton-img" alt="">
                            <span>Pintura</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Albañilería">
                            <img src="img/building.png" class="boton-img" alt="">
                            <span>Albañilería</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Climatizacion y Refrigeración">
                            <img src="img/chiller.png" class="boton-img" alt="">
                            <span>Climatización y Refrigeración</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Carpintería">
                            <img src="img/crossed-hammers.png" class="boton-img" alt="">
                            <span>Carpintería</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Cerrajería">
                            <img src="img/key.png" class="boton-img" alt="">
                            <span>Cerrajería</span>
                        </button>

                        <button type="button" class="chip-categoria" data-categoria="Jardinería">
                            <img src="img/gardening.png" class="boton-img" alt="">
                            <span>Jardinería</span>
                        </button>

                    </nav>

                </section>

            </aside>

            <section class="col-12 col-md-8 col-lg-9 explorar-resultados">

                <h1 class="h3 fw-bold mb-1">
                    Explorar profesionales
                </h1>

                <p class="text-muted small mb-3">
                    Elegí una categoría o buscá directamente lo que necesitás.
                </p>

                <h2 class="h5 fw-bold mb-1">
                    Profesionales disponibles
                </h2>

                <p class="text-secondary small mb-3" id="resumen-resultados" aria-live="polite"></p>

                <section
                    class="row g-3"
                    id="lista-profesionales">


                </section>

                <p
                    class="text-center text-secondary py-5"
                    id="sin-resultados"
                    style="display: none;">

                    🔍 No encontramos profesionales que coincidan con tu búsqueda.

                </p>

            </section>

        </section>

    </main>

    <nav class="bottom-nav shadow-sm p-1 p-md-2">

        <a href="menu.html" class="fw-semibold text-decoration-none py-1 py-md-2">
            <span class="icono-nav">
                <img
                    src="img/house.png"
                    class="icono-home"
                    alt="Inicio">
            </span>
            <span>Inicio</span>
        </a>


        <a href="oficios.html" class="activo fw-bold text-decoration-none py-1 py-md-2">
            <span class="icono-nav">
                <img
                    src="img/magnifying-glass.png"
                    class="icono-home"
                    alt="Buscar">
            </span>
            <span>Buscar</span>
        </a>


        <a href="historial.html" class="fw-semibold text-decoration-none py-1 py-md-2">
            <span class="icono-nav">
                <img
                    src="img/completed-task.png"
                    class="icono-home"
                    alt="Pedidos">
            </span>
            <span>Pedidos</span>
        </a>


        <a href="perfil.html" class="fw-semibold text-decoration-none py-1 py-md-2">
            <span class="icono-nav">
                <img
                    src="img/user.png"
                    class="icono-home"
                    alt="Perfil">
            </span>
            <span>Perfil</span>
        </a>

    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="app.js"></script>

</body>

</html>

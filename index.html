        <form id="form-login">

          <fieldset>

            <legend>Ingresar</legend>

            <label for="login-email">
              Email
            </label>

            <input
              type="email"
              id="login-email"
              placeholder="tu@email.com"
              required
            >

            <label for="login-password">
              Contraseña
            </label>

            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              required
            >

            <button
              type="submit"
              class="btn btn-primario btn-bloque"
            >
              Ingresar
            </button>

          </fieldset>

        </form>


        <form id="form-registro">

          <fieldset>

            <legend>Crear cuenta</legend>

            <section class="tabs-rol">

              <button type="button" class="activo">
                Soy Cliente
              </button>

              <button type="button">
                Soy Trabajador
              </button>

            </section>


            <label for="reg-nombre">
              Nombre completo
            </label>

            <input
              type="text"
              id="reg-nombre"
              placeholder="Ej: Juana Torres"
              required
            >

            <label for="reg-email">
              Email
            </label>

            <input
              type="email"
              id="reg-email"
              placeholder="tu@email.com"
              required
            >

            <label for="reg-password">
              Contraseña
            </label>

            <input
              type="password"
              id="reg-password"
              placeholder="••••••••"
              required
            >
            <fieldset>

              <legend>Datos del trabajador</legend>

              <label for="reg-oficio">
                Oficio
              </label>

              <input
                type="text"
                id="reg-oficio"
                placeholder="Ej: Electricista matriculado, Plomera..."
              >

              <label for="reg-categoria">
                Categoría
              </label>

              <select id="reg-categoria">

                <option value="Electricidad">
                  Electricidad
                </option>

                <option value="Plomería">
                  Plomería
                </option>

                <option value="Pintura">
                  Pintura
                </option>

                <option value="Albañilería">
                  Albañilería
                </option>

                <option value="Aire acondicionado">
                  Aire acondicionado
                </option>

                <option value="Carpintería">
                  Carpintería
                </option>

                <option value="Cerrajería">
                  Cerrajería
                </option>

                <option value="Jardinería">
                  Jardinería
                </option>

              </select>

              <label for="reg-zona">
                Zona donde trabajás
              </label>

              <input
                type="text"
                id="reg-zona"
                placeholder="Ej: Tucumán Capital, Yerba Buena..."
              >

              <label for="reg-precio">
                Precio por hora ($)
              </label>

              <input
                type="number"
                id="reg-precio"
                min="0"
                step="50"
                placeholder="Ej: 4500"
              >

              <label for="reg-descripcion">
                Descripción breve
              </label>

              <textarea
                id="reg-descripcion"
                placeholder="Contale a tus futuros clientes tu experiencia..."
              ></textarea>

            </fieldset>


            <button
              type="submit"
              class="btn btn-primario btn-bloque"
            >
              Crear cuenta
            </button>

          </fieldset>

        </form>


        <p class="link-cambio">
          ¿No tenés cuenta?
          <button>
            Registrate
          </button>
        </p>

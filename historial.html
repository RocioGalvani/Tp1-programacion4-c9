<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seguí el estado de tus pedidos y calificá los trabajos finalizados en OficiosYa.">
  <title>OficiosYa — Mis pedidos</title>
  <link rel="icon" type="image/png" href="./img/hombrelogo.png">

  <link rel="stylesheet" href="styles.css">

<body>

  <header class="topbar">
    <div class="marca d-flex align-items-center gap-2">

    <nav id="topbar-usuario">
      <a href="#" id="btn-cerrar-sesion" class="text-danger fw-bold">Cerrar sesión</a>

  </header>

  <main class="container py-3">

    <section class="encabezado-pagina mt-3">
      <a href="index.html"
        class="d-inline-flex align-items-center mb-2 text-decoration-none text-secondary small fw-bold">

      </a>

      <p>Seguí el estado de tus solicitudes y calificá los trabajos finalizados.</p>
    </section>


    <ul class="row g-3 list-unstyled my-4" id="lista-pedidos"></ul>


    <section class="estado-vacio text-center py-5" id="sin-pedidos" style="display:none;">

      <a href="oficios.html" class="btn btn-primario mt-2">Buscar un oficio</a>

  <nav class="bottom-nav">
    <a href="menu.html">
      <span class="icono-nav"><img src="img/house.png" class="icono-home" alt=""></span>

    <a href="oficios.html">

    </a>
    <a href="historial.html" class="activo">
      <span class="icono-nav"><img src="img/completed-task.png" class="icono-home" alt=""></span>
      <span>Pedidos</span>
    </a>
    <a href="perfil.html">
      <span class="icono-nav"><img src="img/user.png" class="icono-home" alt=""></span>
      <span>Perfil</span>
    </a>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conocé el perfil, calificación y servicios del profesional en OficiosYa.">
  <title>OficiosYa — Perfil del profesional</title>

  <link rel="icon"  href="./img/OfiGO.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="topbar">
    <div class="marca d-flex align-items-center gap-2">
      <img src="./img/hombrelogo.png" class="hombre-logo" alt="OfiGO" style="height: 60px; width: auto;">
      <span>Ofi<span class="text-warning">GO</span></span>
    </div>
    <nav>
      <a href="oficios.html">Oficios</a>
      <a href="perfil.html">Mi perfil</a>
    </nav>
  </header>

  <main class="container" style="max-width: 620px;">

    <a href="oficios.html"
      class="d-inline-flex align-items-center mt-4 text-decoration-none text-secondary small fw-bold">
      ← Volver a la búsqueda
    </a>

    <section class="mt-3 mb-5">

      <article class="panel card p-4 text-center" id="tarjeta-profesional">

        <div class="avatar-profesional mx-auto mb-3">
          <span id="prof-iniciales">--</span>
          <span class="punto-estado" id="prof-estado-punto"></span>
        </div>

        <h1 id="prof-nombre" class="h3 mb-2">—</h1>

        <div class="d-flex justify-content-center mb-3">
          <span class="oficio-tag" id="prof-oficio">—</span>
        </div>

        <section class="my-2">
          <p class="calificacion mb-1 text-warning fs-5" id="prof-estrellas">☆☆☆☆☆</p>
          <p class="text-secondary small" id="prof-resumen-rating">— de 5 · 0 reseñas</p>
        </section>

        <ul class="row text-center list-unstyled my-4 py-3 border-top border-bottom">
          <li class="col-4 border-end">
            <strong id="prof-precio" class="d-block fs-5 text-dark">—</strong>
            <span class="text-secondary small">por hora</span>
          </li>
          <li class="col-4 border-end">
            <strong id="prof-distancia" class="d-block fs-5 text-dark">—</strong>
            <span class="text-secondary small">distancia</span>
          </li>
          <li class="col-4">
            <strong id="prof-llegada" class="d-block fs-5 text-dark">—</strong>
            <span class="text-secondary small">estimado</span>
          </li>
        </ul>

        <section class="tags-especialidad d-flex flex-wrap justify-content-center gap-2 mb-4" id="prof-especialidades">
        </section>

        <section class="text-start mb-4 bg-light p-3 rounded-3">
          <p id="prof-descripcion" class="mb-3 text-secondary">—</p>
          <p class="mb-1 small"><img src="img/location.png" class="icono-img" alt="Ubicación"> Zona de trabajo: <strong
              id="prof-zona" class="text-dark">—</strong></p>
          <p class="mb-0 small" id="prof-disponibilidad">—</p>
        </section>

        <button type="button" class="btn btn-primario w-100 py-2 fs-6" id="btn-contratar">
          Contratar servicio
        </button>

      </article>

    </section>

  </main>

  <nav class="bottom-nav">
    <a href="menu.html">
      <span class="icono-nav"><img src="img/house.png" class="icono-home"></span>
      <span>Inicio</span>
    </a>
    <a href="oficios.html" class="activo">
      <span class="icono-nav"><img src="img/magnifying-glass.png" class="icono-home"></span>
      <span>Buscar</span>
    </a>
    <a href="historial.html">
      <span class="icono-nav"><img src="img/completed-task.png" class="icono-home"></span>
      <span>Pedidos</span>
    </a>
    <a href="perfil.html">
      <span class="icono-nav"><img src="img/user.png" class="icono-home"></span>
      <span>Perfil</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
